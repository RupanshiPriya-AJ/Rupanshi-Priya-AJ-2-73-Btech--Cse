<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - FocusHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .chart-container { position: relative; height: 300px; width: 100%; }
  </style>
</head>
<body>
  <header>
    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-logo"><i class="fa-solid fa-square-check"></i><span>FocusHub</span></div>
      <ul class="sidebar-menu">
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="tasks.html"><i class="fa-solid fa-list-check"></i> Tasks</a></li>
        <li><a href="pomodoro.html"><i class="fa-solid fa-stopwatch"></i> Pomodoro</a></li>
        <li><a href="notes.html"><i class="fa-solid fa-note-sticky"></i> Notes</a></li>
        <li><a href="analytics.html" class="active"><i class="fa-solid fa-chart-pie"></i> Analytics</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <section class="card">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-chart-pie"></i> Task Status</h2>
        </div>
        <div class="chart-container">
          <canvas id="taskChart"></canvas>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-layer-group"></i> Task Priority Breakdown</h2>
        </div>
        <div class="chart-container">
          <canvas id="priorityChart"></canvas>
        </div>
      </section>
    </main>
  </div>

  <footer><p>FocusHub Dashboard &copy; Multi-Page Web Application</p></footer>

  <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
      const savedTheme = localStorage.getItem('focushub_theme_v1') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggleBtn.innerHTML = savedTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('focushub_theme_v1', newTheme);
      themeToggleBtn.innerHTML = newTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    const tasks = JSON.parse(localStorage.getItem('focushub_tasks_v1')) || [];
    
    const activeTasks = tasks.filter(t => !t.completed).length;
    const completedTasks = tasks.filter(t => t.completed).length;

    const lowP = tasks.filter(t => t.priority === 'low').length;
    const medP = tasks.filter(t => t.priority === 'medium').length;
    const highP = tasks.filter(t => t.priority === 'high').length;

    // Chart 1: Active vs Completed
    new Chart(document.getElementById('taskChart'), {
      type: 'doughnut',
      data: {
        labels: ['Active', 'Completed'],
        datasets: [{
          data: [activeTasks, completedTasks],
          backgroundColor: ['#6366f1', '#10b981']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    // Chart 2: Priority Chart
    new Chart(document.getElementById('priorityChart'), {
      type: 'bar',
      data: {
        labels: ['Low', 'Medium', 'High'],
        datasets: [{
          label: 'Tasks Count',
          data: [lowP, medP, highP],
          backgroundColor: ['#10b981', '#f59e0b', '#ef4444']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    initTheme();
  </script>
</body>
</html>
