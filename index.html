<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - FocusHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    .stat-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .stat-icon {
      font-size: 2rem;
      color: var(--accent-primary);
    }
    .stat-info h3 {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .stat-info p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Theme">
      <i class="fa-solid fa-moon"></i>
    </button>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fa-solid fa-square-check"></i>
        <span>FocusHub</span>
      </div>
      <ul class="sidebar-menu">
        <li><a href="index.html" class="active"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="tasks.html"><i class="fa-solid fa-list-check"></i> Tasks</a></li>
        <li><a href="pomodoro.html"><i class="fa-solid fa-stopwatch"></i> Pomodoro</a></li>
        <li><a href="notes.html"><i class="fa-solid fa-note-sticky"></i> Notes</a></li>
        <li><a href="analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <section class="card full-width">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-gauge"></i> Overview</h2>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <i class="fa-solid fa-list-check stat-icon"></i>
            <div class="stat-info">
              <h3 id="totalTasksCount">0</h3>
              <p>Total Tasks</p>
            </div>
          </div>
          <div class="stat-card">
            <i class="fa-solid fa-check-double stat-icon" style="color: var(--accent-success);"></i>
            <div class="stat-info">
              <h3 id="completedTasksCount">0</h3>
              <p>Completed Tasks</p>
            </div>
          </div>
          <div class="stat-card">
            <i class="fa-solid fa-note-sticky stat-icon" style="color: var(--accent-warning);"></i>
            <div class="stat-info">
              <h3 id="totalNotesCount">0</h3>
              <p>Total Notes</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer>
    <p>FocusHub Dashboard &copy; Multi-Page Web Application</p>
  </footer>

  <script>
    // Theme Management
    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
      const savedTheme = localStorage.getItem('focushub_theme_v1') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggleBtn.innerHTML = savedTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('focushub_theme_v1', newTheme);
      themeToggleBtn.innerHTML = newTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    // Load Stats from LocalStorage
    function loadDashboardStats() {
      const tasks = JSON.parse(localStorage.getItem('focushub_tasks_v1')) || [];
      const notes = JSON.parse(localStorage.getItem('focushub_notes_v1')) || [];
      
      document.getElementById('totalTasksCount').textContent = tasks.length;
      document.getElementById('completedTasksCount').textContent = tasks.filter(t => t.completed).length;
      document.getElementById('totalNotesCount').textContent = notes.length;
    }

    initTheme();
    loadDashboardStats();
  </script>
</body>
</html>
