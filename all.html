<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Hub & Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --border-color: #475569;
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-secondary: #ffffff;
      --bg-card: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-primary: #4f46e5;
      --accent-hover: #4338ca;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }

    /* Top Header */
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.1rem;
      padding: 0.5rem 0.8rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
    }

    .theme-toggle-btn:hover {
      background-color: var(--bg-card);
    }

    /* App Layout with Sidebar */
    .app-container {
      display: flex;
      flex: 1;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 260px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      gap: 2rem;
      position: sticky;
      top: 57px;
      height: calc(100vh - 57px);
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-primary);
      padding-left: 0.5rem;
    }

    .sidebar-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sidebar-menu li a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: var(--radius);
      font-weight: 500;
      transition: var(--transition);
    }

    .sidebar-menu li a:hover,
    .sidebar-menu li a.active {
      background-color: var(--accent-primary);
      color: #ffffff;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-content: start;
    }

    @media (min-width: 992px) {
      .main-content {
        grid-template-columns: 1fr 1fr;
      }
      .card.full-width {
        grid-column: 1 / -1;
      }
    }

    /* Card Component */
    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Form Controls */
    input, select, textarea, button {
      font-family: inherit;
      font-size: 0.95rem;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .btn {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-primary);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: var(--bg-card);
    }

    .task-inputs {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .task-input-row {
      display: flex;
      gap: 0.5rem;
    }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .filter-btn {
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: transparent;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      background-color: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 380px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background-color: var(--bg-primary);
      border-radius: 8px;
      border-left: 4px solid var(--accent-primary);
      transition: var(--transition);
    }

    .task-item.priority-high { border-left-color: var(--accent-danger); }
    .task-item.priority-medium { border-left-color: var(--accent-warning); }
    .task-item.priority-low { border-left-color: var(--accent-success); }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
    }

    .task-actions {
      display: flex;
      gap: 0.5rem;
    }

    .action-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      transition: var(--transition);
    }

    .action-icon:hover {
      color: var(--accent-danger);
    }

    .timer-display-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 0;
    }

    .timer-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 6px solid var(--accent-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }

    .timer-time {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .timer-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .timer-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      width: 100%;
    }

    .timer-modes {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      max-height: 380px;
      overflow-y: auto;
    }

    .note-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 140px;
      position: relative;
    }

    .note-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .note-body {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      opacity: 0.5;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        top: 0;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
        padding: 1rem;
        gap: 1rem;
      }
      .sidebar-menu {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 0.5rem;
      }
      .sidebar-menu li a {
        white-space: nowrap;
        padding: 0.5rem 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header with Theme Toggle -->
  <header>
    <div class="nav-tools">
      <button class="theme-toggle-btn" id="themeToggle" title="Toggle Light/Dark Theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- App Container (Sidebar + Main Content) -->
  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <i class="fa-solid fa-square-check"></i>
        <span>FocusHub</span>
      </div>
      <ul class="sidebar-menu">
        <li><a href="#" class="active"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="#"><i class="fa-solid fa-list-check"></i> Tasks</a></li>
        <li><a href="#"><i class="fa-solid fa-stopwatch"></i> Pomodoro</a></li>
        <li><a href="#"><i class="fa-solid fa-note-sticky"></i> Notes</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      
      <!-- Task Manager Widget -->
      <section class="card">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-list-check"></i> Tasks</h2>
        </div>

        <div class="task-inputs">
          <div class="task-input-row">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <select id="prioritySelect" style="width: 120px;">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <button class="btn" id="addTaskBtn">
            <i class="fa-solid fa-plus"></i> Add Task
          </button>
        </div>

        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul class="task-list" id="taskList"></ul>
      </section>

      <!-- Pomodoro Timer Widget -->
      <section class="card">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-stopwatch"></i> Pomodoro Timer</h2>
        </div>

        <div class="timer-modes">
          <button class="filter-btn active" id="modeFocus">Focus (25m)</button>
          <button class="filter-btn" id="modeShort">Short Break (5m)</button>
          <button class="filter-btn" id="modeLong">Long Break (15m)</button>
        </div>

        <div class="timer-display-container">
          <div class="timer-circle">
            <span class="timer-time" id="timerDisplay">25:00</span>
            <span class="timer-label" id="timerLabel">Focus Time</span>
          </div>

          <div class="timer-controls">
            <button class="btn" id="startTimerBtn">
              <i class="fa-solid fa-play"></i> Start
            </button>
            <button class="btn btn-secondary" id="resetTimerBtn">
              <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
          </div>
        </div>
      </section>

      <!-- Quick Notes Widget -->
      <section class="card full-width">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-note-sticky"></i> Quick Notes</h2>
          <button class="btn" id="addNoteBtn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
            <i class="fa-solid fa-plus"></i> New Note
          </button>
        </div>

        <div class="task-inputs" id="noteInputContainer" style="display: none;">
          <input type="text" id="noteTitleInput" placeholder="Note Title...">
          <textarea id="noteContentInput" rows="3" placeholder="Write your note contents..."></textarea>
          <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
            <button class="btn btn-secondary" id="cancelNoteBtn">Cancel</button>
            <button class="btn" id="saveNoteBtn">Save Note</button>
          </div>
        </div>

        <div class="notes-grid" id="notesGrid"></div>
      </section>

    </main>
  </div>

  <footer>
    <p>FocusHub Dashboard &copy; Single File Web Application</p>
  </footer>

  <!-- Application JavaScript -->
  <script>
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const STORAGE_KEY_TASKS = 'focushub_tasks_v1';
    const STORAGE_KEY_NOTES = 'focushub_notes_v1';
    const STORAGE_KEY_THEME = 'focushub_theme_v1';

    let tasks = [];
    let notes = [];
    let currentFilter = 'all';

    function loadData() {
      try {
        tasks = JSON.parse(localStorage.getItem(STORAGE_KEY_TASKS)) || [];
      } catch (e) { tasks = []; }

      try {
        notes = JSON.parse(localStorage.getItem(STORAGE_KEY_NOTES)) || [];
      } catch (e) { notes = []; }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks));
    }

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY_NOTES, JSON.stringify(notes));
    }

    // --- Theme Management ---
    const themeToggleBtn = document.getElementById('themeToggle');
    
    function initTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeIcon(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem(STORAGE_KEY_THEME, newTheme);
      updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
      themeToggleBtn.innerHTML = theme === 'light' 
        ? '<i class="fa-solid fa-sun"></i>' 
        : '<i class="fa-solid fa-moon"></i>';
    }

    themeToggleBtn.addEventListener('click', toggleTheme);

    // --- Task Manager ---
    const taskInput = document.getElementById('taskInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');
    const filterBtns = document.querySelectorAll('.filter-bar .filter-btn');

    function renderTasks() {
      taskList.innerHTML = '';
      
      const filteredTasks = tasks.filter(task => {
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-clipboard-list"></i>
            <p>No tasks found</p>
          </div>
        `;
        return;
      }

      filteredTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item priority-${task.priority} ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="task-content">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
            <span>${escapeHTML(task.text)}</span>
          </div>
          <div class="task-actions">
            <button class="action-icon" onclick="deleteTask(${task.id})" title="Delete Task">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      const newTask = {
        id: Date.now(),
        text: text,
        priority: prioritySelect.value,
        completed: false
      };

      tasks.push(newTask);
      saveTasks();
      renderTasks();
      taskInput.value = '';
    }

    window.toggleTask = function(id) {
      tasks = tasks.map(task => 
        task.id === id ? { ...task, completed: !task.completed } : task
      );
      saveTasks();
      renderTasks();
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      renderTasks();
    };

    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    // --- Pomodoro Timer ---
    let timerInterval = null;
    let timeRemaining = 25 * 60;
    let isRunning = false;
    let currentMode = 'focus';

    const timerDisplay = document.getElementById('timerDisplay');
    const timerLabel = document.getElementById('timerLabel');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const resetTimerBtn = document.getElementById('resetTimerBtn');

    const modeFocusBtn = document.getElementById('modeFocus');
    const modeShortBtn = document.getElementById('modeShort');
    const modeLongBtn = document.getElementById('modeLong');

    const modeTimes = {
      focus: 25 * 60,
      short: 5 * 60,
      long: 15 * 60
    };

    function updateTimerDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRe
