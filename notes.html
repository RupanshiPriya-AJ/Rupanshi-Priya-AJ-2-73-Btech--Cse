<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - FocusHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .note-card { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; }
    .note-title { font-weight: 600; font-size: 1rem; margin-bottom: 0.5rem; }
    .note-body { font-size: 0.85rem; color: var(--text-muted); flex: 1; word-break: break-word; }
    .note-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.75rem; font-size: 0.75rem; color: var(--text-muted); }
    .action-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; }
    .action-icon:hover { color: var(--accent-danger); }
  </style>
</head>
<body>
  <header>
    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-logo"><i class="fa-solid fa-square-check"></i><span>FocusHub</span></div>
      <ul class="sidebar-menu">
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="tasks.html"><i class="fa-solid fa-list-check"></i> Tasks</a></li>
        <li><a href="pomodoro.html"><i class="fa-solid fa-stopwatch"></i> Pomodoro</a></li>
        <li><a href="notes.html" class="active"><i class="fa-solid fa-note-sticky"></i> Notes</a></li>
        <li><a href="analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <section class="card full-width">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-note-sticky"></i> Quick Notes</h2>
          <button class="btn" id="addNoteBtn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;"><i class="fa-solid fa-plus"></i> New Note</button>
        </div>

        <div class="task-inputs" id="noteInputContainer" style="display: none; flex-direction: column; gap: 0.5rem;">
          <input type="text" id="noteTitleInput" placeholder="Note Title...">
          <textarea id="noteContentInput" rows="3" placeholder="Write your note contents..."></textarea>
          <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
            <button class="btn btn-secondary" id="cancelNoteBtn">Cancel</button>
            <button class="btn" id="saveNoteBtn">Save Note</button>
          </div>
        </div>

        <div class="notes-grid" id="notesGrid"></div>
      </section>
    </main>
  </div>

  <footer><p>FocusHub Dashboard &copy; Multi-Page Web Application</p></footer>

  <script>
    function escapeHTML(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
      const savedTheme = localStorage.getItem('focushub_theme_v1') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggleBtn.innerHTML = savedTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('focushub_theme_v1', newTheme);
      themeToggleBtn.innerHTML = newTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    let notes = JSON.parse(localStorage.getItem('focushub_notes_v1')) || [];
    const notesGrid = document.getElementById('notesGrid');

    function saveNotes() { localStorage.setItem('focushub_notes_v1', JSON.stringify(notes)); }

    function renderNotes() {
      notesGrid.innerHTML = '';
      if (notes.length === 0) {
        notesGrid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><i class="fa-solid fa-note-sticky"></i><p>No notes created yet</p></div>`;
        return;
      }

      notes.forEach(note => {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.innerHTML = `
          <div>
            <div class="note-title">${escapeHTML(note.title)}</div>
            <div class="note-body">${escapeHTML(note.content)}</div>
          </div>
          <div class="note-footer">
            <span>${note.date}</span>
            <button class="action-icon" onclick="deleteNote(${note.id})"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
        notesGrid.appendChild(card);
      });
    }

    window.deleteNote = function(id) {
      notes = notes.filter(n => n.id !== id);
      saveNotes(); renderNotes();
    };

    document.getElementById('addNoteBtn').addEventListener('click', () => { document.getElementById('noteInputContainer').style.display = 'flex'; });
    document.getElementById('cancelNoteBtn').addEventListener('click', () => { document.getElementById('noteInputContainer').style.display = 'none'; });
    document.getElementById('saveNoteBtn').addEventListener('click', () => {
      const title = document.getElementById('noteTitleInput').value.trim();
      const content = document.getElementById('noteContentInput').value.trim();
      if (!title && !content) return;
      notes.push({ id: Date.now(), title: title || 'Untitled', content, date: new Date().toLocaleDateString() });
      saveNotes(); renderNotes();
      document.getElementById('noteTitleInput').value = '';
      document.getElementById('noteContentInput').value = '';
      document.getElementById('noteInputContainer').style.display = 'none';
    });

    initTheme(); renderNotes();
  </script>
</body>
</html>
