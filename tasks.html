<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - FocusHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .task-inputs { display: flex; flex-direction: column; gap: 0.75rem; }
    .task-input-row { display: flex; gap: 0.5rem; }
    .filter-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; }
    .filter-btn { padding: 0.35rem 0.75rem; font-size: 0.85rem; border-radius: 20px; border: 1px solid var(--border-color); background-color: transparent; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background-color: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; max-height: 450px; overflow-y: auto; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background-color: var(--bg-primary); border-radius: 8px; border-left: 4px solid var(--accent-primary); }
    .task-item.priority-high { border-left-color: var(--accent-danger); }
    .task-item.priority-medium { border-left-color: var(--accent-warning); }
    .task-item.priority-low { border-left-color: var(--accent-success); }
    .task-item.completed span { text-decoration: line-through; color: var(--text-muted); }
    .task-content { display: flex; align-items: center; gap: 0.75rem; flex: 1; }
    .action-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
    .action-icon:hover { color: var(--accent-danger); }
  </style>
</head>
<body>
  <header>
    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-logo"><i class="fa-solid fa-square-check"></i><span>FocusHub</span></div>
      <ul class="sidebar-menu">
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="tasks.html" class="active"><i class="fa-solid fa-list-check"></i> Tasks</a></li>
        <li><a href="pomodoro.html"><i class="fa-solid fa-stopwatch"></i> Pomodoro</a></li>
        <li><a href="notes.html"><i class="fa-solid fa-note-sticky"></i> Notes</a></li>
        <li><a href="analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <section class="card full-width">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-list-check"></i> Task Manager</h2>
        </div>

        <div class="task-inputs">
          <div class="task-input-row">
            <input type="text" id="taskInput" placeholder="What needs to be done?">
            <select id="prioritySelect" style="width: 140px;">
              <option value="low">Low Priority</option>
              <option value="medium" selected>Medium Priority</option>
              <option value="high">High Priority</option>
            </select>
          </div>
          <button class="btn" id="addTaskBtn"><i class="fa-solid fa-plus"></i> Add Task</button>
        </div>

        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All Tasks</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul class="task-list" id="taskList"></ul>
      </section>
    </main>
  </div>

  <footer><p>FocusHub Dashboard &copy; Multi-Page Web Application</p></footer>

  <script>
    function escapeHTML(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
      const savedTheme = localStorage.getItem('focushub_theme_v1') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggleBtn.innerHTML = savedTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('focushub_theme_v1', newTheme);
      themeToggleBtn.innerHTML = newTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    let tasks = JSON.parse(localStorage.getItem('focushub_tasks_v1')) || [];
    let currentFilter = 'all';

    const taskInput = document.getElementById('taskInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskList = document.getElementById('taskList');
    const filterBtns = document.querySelectorAll('.filter-bar .filter-btn');

    function saveTasks() { localStorage.setItem('focushub_tasks_v1', JSON.stringify(tasks)); }

    function renderTasks() {
      taskList.innerHTML = '';
      const filteredTasks = tasks.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        taskList.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clipboard-list"></i><p>No tasks found</p></div>`;
        return;
      }

      filteredTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item priority-${task.priority} ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="task-content">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
            <span>${escapeHTML(task.text)}</span>
          </div>
          <button class="action-icon" onclick="deleteTask(${task.id})"><i class="fa-solid fa-trash"></i></button>
        `;
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now(), text, priority: prioritySelect.value, completed: false });
      saveTasks();
      renderTasks();
      taskInput.value = '';
    }

    window.toggleTask = function(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks(); renderTasks();
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks(); renderTasks();
    };

    addTaskBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    initTheme();
    renderTasks();
  </script>
</body>
</html>
