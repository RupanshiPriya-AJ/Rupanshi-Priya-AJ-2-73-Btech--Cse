<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer - FocusHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .timer-display-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 0; }
    .timer-circle { width: 220px; height: 220px; border-radius: 50%; border: 6px solid var(--accent-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 1.5rem; box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
    .timer-time { font-size: 2.8rem; font-weight: 700; letter-spacing: 2px; }
    .timer-label { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; margin-top: 0.25rem; }
    .timer-controls { display: flex; gap: 1rem; justify-content: center; width: 100%; }
    .timer-modes { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; }
    .filter-btn { padding: 0.5rem 1rem; border-radius: 20px; border: 1px solid var(--border-color); background: transparent; color: var(--text-muted); cursor: pointer; }
    .filter-btn.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); }
  </style>
</head>
<body>
  <header>
    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-logo"><i class="fa-solid fa-square-check"></i><span>FocusHub</span></div>
      <ul class="sidebar-menu">
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
        <li><a href="tasks.html"><i class="fa-solid fa-list-check"></i> Tasks</a></li>
        <li><a href="pomodoro.html" class="active"><i class="fa-solid fa-stopwatch"></i> Pomodoro</a></li>
        <li><a href="notes.html"><i class="fa-solid fa-note-sticky"></i> Notes</a></li>
        <li><a href="analytics.html"><i class="fa-solid fa-chart-pie"></i> Analytics</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <section class="card full-width">
        <div class="card-header">
          <h2 class="card-title"><i class="fa-solid fa-stopwatch"></i> Pomodoro Focus Timer</h2>
        </div>

        <div class="timer-modes">
          <button class="filter-btn active" id="modeFocus">Focus (25m)</button>
          <button class="filter-btn" id="modeShort">Short Break (5m)</button>
          <button class="filter-btn" id="modeLong">Long Break (15m)</button>
        </div>

        <div class="timer-display-container">
          <div class="timer-circle">
            <span class="timer-time" id="timerDisplay">25:00</span>
            <span class="timer-label" id="timerLabel">Focus Time</span>
          </div>

          <div class="timer-controls">
            <button class="btn" id="startTimerBtn"><i class="fa-solid fa-play"></i> Start</button>
            <button class="btn btn-secondary" id="resetTimerBtn"><i class="fa-solid fa-rotate-right"></i> Reset</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer><p>FocusHub Dashboard &copy; Multi-Page Web Application</p></footer>

  <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    function initTheme() {
      const savedTheme = localStorage.getItem('focushub_theme_v1') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      themeToggleBtn.innerHTML = savedTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    }
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('focushub_theme_v1', newTheme);
      themeToggleBtn.innerHTML = newTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    let timerInterval = null;
    let timeRemaining = 25 * 60;
    let isRunning = false;
    let currentMode = 'focus';

    const modeTimes = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };

    const timerDisplay = document.getElementById('timerDisplay');
    const timerLabel = document.getElementById('timerLabel');
    const startTimerBtn = document.getElementById('startTimerBtn');

    function updateTimerDisplay() {
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function setMode(mode) {
      currentMode = mode;
      timeRemaining = modeTimes[mode];
      pauseTimer();
      document.querySelectorAll('.timer-modes .filter-btn').forEach(b => b.classList.remove('active'));
      
      if (mode === 'focus') { document.getElementById('modeFocus').classList.add('active'); timerLabel.textContent = 'Focus Time'; }
      else if (mode === 'short') { document.getElementById('modeShort').classList.add('active'); timerLabel.textContent = 'Short Break'; }
      else { document.getElementById('modeLong').classList.add('active'); timerLabel.textContent = 'Long Break'; }

      updateTimerDisplay();
    }

    function startTimer() {
      if (isRunning) { pauseTimer(); return; }
      isRunning = true;
      startTimerBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
      timerInterval = setInterval(() => {
        if (timeRemaining > 0) {
          timeRemaining--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startTimerBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
          alert('Time is up!');
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startTimerBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
    }

    document.getElementById('modeFocus').addEventListener('click', () => setMode('focus'));
    document.getElementById('modeShort').addEventListener('click', () => setMode('short'));
    document.getElementById('modeLong').addEventListener('click', () => setMode('long'));
    startTimerBtn.addEventListener('click', startTimer);
    document.getElementById('resetTimerBtn').addEventListener('click', () => { pauseTimer(); timeRemaining = modeTimes[currentMode]; updateTimerDisplay(); });

    initTheme();
    updateTimerDisplay();
  </script>
</body>
</html>
